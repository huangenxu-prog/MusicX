<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360">
<defs>
  <linearGradient id="ink" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#ffffff"/>
    <stop offset=".62" stop-color="#fffaff"/>
    <stop offset="1" stop-color="#e8dfff"/>
  </linearGradient>
  <filter id="softGlow" x="-25%" y="-35%" width="150%" height="180%">
    <feGaussianBlur stdDeviation="11" result="blur"/>
    <feFlood flood-color="#b18cff" flood-opacity=".62"/>
    <feComposite in2="blur" operator="in"/>
    <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <linearGradient id="wave" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#f5d8ff"/>
    <stop offset="1" stop-color="#bb82ff"/>
  </linearGradient>
</defs>
<g filter="url(#softGlow)">
  <text x="548" y="238" text-anchor="middle"
        font-family="HanziPen SC, STXingkai, Kaiti SC, KaiTi, cursive"
        font-size="205" font-weight="600" font-style="italic"
        letter-spacing="3" fill="url(#ink)">发现音乐</text>
  <path d="M85 274 C235 330 380 312 490 275 C560 252 650 263 740 278"
        fill="none" stroke="url(#ink)" stroke-width="7" stroke-linecap="round" opacity=".92"/>
  <path d="M110 286 C230 322 332 315 408 293"
        fill="none" stroke="#d9c2ff" stroke-width="3" stroke-linecap="round" opacity=".8"/>
</g>
<g fill="url(#wave)" filter="url(#softGlow)" transform="translate(900 176)">
  <rect x="0" y="36" width="13" height="54" rx="6.5"/>
  <rect x="24" y="12" width="13" height="102" rx="6.5"/>
  <rect x="48" y="0" width="13" height="126" rx="6.5"/>
  <rect x="72" y="26" width="13" height="76" rx="6.5"/>
  <rect x="96" y="43" width="13" height="40" rx="6.5"/>
</g>
</svg>