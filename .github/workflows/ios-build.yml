# Build trigger refresh: run 330 after cancelled 329.
name: MusicX iOS build
# Build trigger retained for the active QQ Music integration branch.

on:
  push:
    branches:
      - ios/initial-scaffold
      - home/final-design-asset-pass
      - feature/qqmusic-playlist-integration
      - redesign/home-search-library-review
      - architecture/three-layer-resource-engine
      - restore/ui-build-461-preserve-playback
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: musicx-ios-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Install search category photo assets
        run: |
          ASSET_CATALOG="$(find . -type d -name Assets.xcassets -print -quit)"
          test -n "$ASSET_CATALOG"
          unzip -oq "$ASSET_CATALOG/MusicX-SearchCategory-Assets.zip" -d "$ASSET_CATALOG"
          rm "$ASSET_CATALOG/MusicX-SearchCategory-Assets.zip"
          for n in 01 02 03 04 05 06; do
            test -s "$ASSET_CATALOG/SearchCategory${n}.imageset/SearchCategory${n}.jpg"
            plutil -lint "$ASSET_CATALOG/SearchCategory${n}.imageset/Contents.json" || python3 -m json.tool "$ASSET_CATALOG/SearchCategory${n}.imageset/Contents.json" >/dev/null
          done

      - name: Install selected MusicX artwork assets
        run: |
          set -euo pipefail
          ASSET_CATALOG="$(find . -type d -name Assets.xcassets -print -quit)"
          test -n "$ASSET_CATALOG"
          SOURCE="$RUNNER_TEMP/musicx-selected-artwork"
          mkdir -p "$SOURCE"
          unzip -oq "$ASSET_CATALOG/MusicX-Selected-Assets-v1.zip" -d "$SOURCE"
          for name in category_chinese_pop category_classic category_instrumental category_light category_rock category_singers chart_hot chart_new chart_rising daily_recommend; do
            test -s "$SOURCE/$name.imageset/$name.jpg"
            python3 -m json.tool "$SOURCE/$name.imageset/Contents.json" >/dev/null
            rm -rf "$ASSET_CATALOG/$name.imageset"
            cp -R "$SOURCE/$name.imageset" "$ASSET_CATALOG/$name.imageset"
          done
          echo "Installed selected 10 artwork image sets from MusicX-Selected-Assets-v1.zip."

      - name: Install unified MusicX redesign assets
        run: |
          set -euo pipefail
          ASSET_CATALOG="$(find . -type d -name Assets.xcassets -print -quit)"
          test -n "$ASSET_CATALOG"
          PACKAGE="$ASSET_CATALOG/MusicX-Redesign-Assets.zip"
          test -s "$PACKAGE"
          SOURCE="$RUNNER_TEMP/musicx-redesign-assets"
          mkdir -p "$SOURCE"
          unzip -oq "$PACKAGE" -d "$SOURCE"
          REDESIGN_CATALOG="$(find "$SOURCE" -type d -name Assets.xcassets -print -quit)"
          test -n "$REDESIGN_CATALOG"
          while IFS= read -r -d '' IMAGE_SET; do
            NAME="$(basename "$IMAGE_SET")"
            python3 -m json.tool "$IMAGE_SET/Contents.json" >/dev/null
            IMAGE_FILE="$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["images"][0]["filename"])' "$IMAGE_SET/Contents.json")"
            test -s "$IMAGE_SET/$IMAGE_FILE"
            rm -rf "$ASSET_CATALOG/$NAME"
            cp -R "$IMAGE_SET" "$ASSET_CATALOG/$NAME"
          done < <(find "$REDESIGN_CATALOG" -maxdepth 1 -type d -name '*.imageset' -print0)
          rm "$PACKAGE"
          echo "Installed unified redesign image sets; replaced only matching asset names."

      - name: Install 12 home discovery artworks
        run: |
          set -euo pipefail
          ASSET_CATALOG="$(find . -type d -name Assets.xcassets -print -quit)"
          test -n "$ASSET_CATALOG"
          PACKAGE="$ASSET_CATALOG/MusicX_12_Album_Assets_Ready_To_Upload.zip"
          test -s "$PACKAGE"
          SOURCE="$RUNNER_TEMP/musicx-home-discovery-artworks"
          mkdir -p "$SOURCE"
          unzip -oq "$PACKAGE" -d "$SOURCE"
          for n in 01 02 03 04 05 06 07 08 09 10 11 12; do
            NAME="album_$n"
            test -s "$SOURCE/$NAME.imageset/$NAME.png"
            python3 -m json.tool "$SOURCE/$NAME.imageset/Contents.json" >/dev/null
            rm -rf "$ASSET_CATALOG/$NAME.imageset"
            cp -R "$SOURCE/$NAME.imageset" "$ASSET_CATALOG/$NAME.imageset"
          done
          echo "Installed 12 home discovery artwork assets."

      - name: Render app icon asset
        run: swift scripts/render-app-icon.swift

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Archive for physical iOS devices (unsigned)
        run: |
          xcodebuild \
            -project MusicX.xcodeproj \
            -scheme MusicX \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/MusicX.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            archive

      - name: Verify archived background audio configuration
        run: |
          /usr/libexec/PlistBuddy -c 'Print :UIBackgroundModes' build/MusicX.xcarchive/Products/Applications/MusicX.app/Info.plist
          /usr/libexec/PlistBuddy -c 'Print :UIBackgroundModes:0' build/MusicX.xcarchive/Products/Applications/MusicX.app/Info.plist | grep -qx audio

      - name: Package unsigned IPA
        run: |
          mkdir -p build/ipa/Payload
          cp -R build/MusicX.xcarchive/Products/Applications/MusicX.app build/ipa/Payload/
          cd build/ipa
          /usr/bin/zip -qry MusicX-unsigned.ipa Payload
          test -s MusicX-unsigned.ipa

      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: MusicX-unsigned-IPA
          path: build/ipa/MusicX-unsigned.ipa
          if-no-files-found: error
          retention-days: 14
