name: MusicX iOS build

on:
  push:
    branches:
      - ios/initial-scaffold
      - home/final-design-asset-pass
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: musicx-ios-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Render app icon asset
        run: swift scripts/render-app-icon.swift

      - name: Install exact approved hero banner asset
        run: |
          mkdir -p MusicX/Assets.xcassets/hero_title.imageset
          base64 -D assets/hero-calligraphy/exact-banner.jpg.b64 > MusicX/Assets.xcassets/hero_title.imageset/hero_title.jpg
          test -s MusicX/Assets.xcassets/hero_title.imageset/hero_title.jpg
          sips -g pixelWidth -g pixelHeight MusicX/Assets.xcassets/hero_title.imageset/hero_title.jpg
          cat > MusicX/Assets.xcassets/hero_title.imageset/Contents.json <<'JSON'
          {
            "images" : [
              {
                "filename" : "hero_title.jpg",
                "idiom" : "universal"
              }
            ],
            "info" : {
              "author" : "xcode",
              "version" : 1
            }
          }
          JSON

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Archive for physical iOS devices (unsigned)
        run: |
          xcodebuild \
            -project MusicX.xcodeproj \
            -scheme MusicX \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/MusicX.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            archive

      - name: Verify archived background audio configuration
        run: |
          /usr/libexec/PlistBuddy -c 'Print :UIBackgroundModes' build/MusicX.xcarchive/Products/Applications/MusicX.app/Info.plist
          /usr/libexec/PlistBuddy -c 'Print :UIBackgroundModes:0' build/MusicX.xcarchive/Products/Applications/MusicX.app/Info.plist | grep -qx audio

      - name: Package unsigned IPA
        run: |
          mkdir -p build/ipa/Payload
          cp -R build/MusicX.xcarchive/Products/Applications/MusicX.app build/ipa/Payload/
          cd build/ipa
          /usr/bin/zip -qry MusicX-unsigned.ipa Payload
          test -s MusicX-unsigned.ipa

      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: MusicX-unsigned-IPA
          path: build/ipa/MusicX-unsigned.ipa
          if-no-files-found: error
          retention-days: 14
