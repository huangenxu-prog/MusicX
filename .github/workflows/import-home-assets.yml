name: Import MusicX home image assets

on:
  push:
    branches:
      - home/final-design-asset-pass
    paths:
      - "MusicX_Home_Assets_Xcode_20261111.zip"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import-assets:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout development branch
        uses: actions/checkout@v4
        with:
          ref: home/final-design-asset-pass

      - name: Validate and import image sets
        shell: bash
        run: |
          set -euo pipefail
          archive="MusicX_Home_Assets_Xcode_20261111.zip"
          test -f "$archive" || { echo "::error::Upload $archive to the repository root first."; exit 1; }

          rm -rf /tmp/musicx-home-assets
          mkdir -p /tmp/musicx-home-assets
          unzip -q "$archive" -d /tmp/musicx-home-assets

          mapfile -t sets < <(find /tmp/musicx-home-assets -mindepth 1 -maxdepth 1 -type d -name '*.imageset' | sort)
          if [ "${#sets[@]}" -ne 24 ]; then
            echo "::error::Expected 24 .imageset folders, found ${#sets[@]}."
            exit 1
          fi

          python3 - <<'PY'
          import json
          from pathlib import Path
          root = Path("/tmp/musicx-home-assets")
          sets = sorted(root.glob("*.imageset"))
          if len(sets) != 24:
              raise SystemExit("Expected exactly 24 image sets")
          for folder in sets:
              manifest = folder / "Contents.json"
              if not manifest.is_file():
                  raise SystemExit(f"Missing {manifest}")
              data = json.loads(manifest.read_text())
              for image in data.get("images", []):
                  filename = image.get("filename")
                  if filename and not (folder / filename).is_file():
                      raise SystemExit(f"Missing image {folder / filename}")
          jpgs = list(root.glob("*.imageset/*.jpg"))
          if len(jpgs) != 24:
              raise SystemExit(f"Expected 24 JPGs, found {len(jpgs)}")
          print("Validated 24 image sets and 24 JPG files.")
          PY

          destination="MusicX/Assets.xcassets"
          test -d "$destination" || { echo "::error::Asset catalog not found: $destination"; exit 1; }

          for folder in "${sets[@]}"; do
            name="$(basename "$folder")"
            if [ -e "$destination/$name" ]; then
              echo "::error::Refusing to overwrite existing asset set: $name"
              exit 1
            fi
            cp -R "$folder" "$destination/$name"
          done

          rm "$archive"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$destination"
          git add -u "$archive" 2>/dev/null || true
          git commit -m "Import 24 homepage photo asset sets"
          git push origin HEAD:home/final-design-asset-pass
