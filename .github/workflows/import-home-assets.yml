name: Import redesigned MusicX category assets

on:
  push:
    branches:
      - home/final-design-asset-pass
    paths:
      - ".github/workflows/import-home-assets.yml"
      - "MusicX-Complete-Visual-Assets.zip"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import-assets:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout development branch
        uses: actions/checkout@v4
        with:
          ref: home/final-design-asset-pass

      - name: Import complete visual asset bundle
        shell: bash
        run: |
          set -euo pipefail
          archive="MusicX-Complete-Visual-Assets.zip"
          test -f "$archive" || { echo "::error::Complete visual asset ZIP not found at repository root."; exit 1; }

          temp="/tmp/musicx-complete-visual-assets"
          mkdir -p "$temp"
          unzip -q "$archive" -d "$temp"

          expected=(category_chinese_pop category_classic category_light category_instrumental category_rock category_singers daily_recommend chart_hot chart_new chart_rising)
          destination="MusicX/Assets.xcassets"
          for name in "${expected[@]}"; do
            folder="$(find "$temp" -type d -name "$name.imageset" -print -quit)"
            test -n "$folder" || { echo "::error::Missing $name.imageset in uploaded ZIP."; exit 1; }
            python3 - "$folder" "$name" <<'PY'
          import json, sys
          from pathlib import Path
          folder, name = Path(sys.argv[1]), sys.argv[2]
          data = json.loads((folder / "Contents.json").read_text())
          files = [x.get("filename") for x in data.get("images", []) if x.get("filename")]
          if len(files) != 1 or not (folder / files[0]).is_file():
              raise SystemExit(f"Invalid image manifest for {name}: {files}")
          if not files[0].lower().endswith((".jpg", ".jpeg")):
              raise SystemExit(f"Unexpected image format for {name}: {files[0]}")
          PY
            rm -rf "$destination/$name.imageset"
            cp -R "$folder" "$destination/$name.imageset"
            echo "Imported $name"
          done

          rm "$archive"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$destination" "$archive"
          git commit -m "Import complete redesigned MusicX visual assets"
          git push origin HEAD:home/final-design-asset-pass
# Asset import completed; subsequent iOS build uses the committed image sets.
