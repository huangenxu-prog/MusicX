name: Import redesigned MusicX category assets

on:
  push:
    branches:
      - home/final-design-asset-pass
    paths:
      - ".github/workflows/import-home-assets.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import-assets:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout development branch
        uses: actions/checkout@v4
        with:
          ref: home/final-design-asset-pass

      - name: Validate and import six redesigned category images
        shell: bash
        run: |
          set -euo pipefail
          archive="MusicX/Assets.xcassets/MusicX-Redesigned-Category-Assets-v2.zip"
          test -f "$archive" || { echo "::error::Uploaded category asset ZIP not found."; exit 1; }

          rm -rf /tmp/musicx-category-assets
          mkdir -p /tmp/musicx-category-assets
          unzip -q "$archive" -d /tmp/musicx-category-assets

          expected=(category_chinese_pop category_classic category_light category_instrumental category_rock category_singers)
          destination="MusicX/Assets.xcassets"
          for name in "${expected[@]}"; do
            folder="$(find /tmp/musicx-category-assets -type d -name "$name.imageset" -print -quit)"
            test -n "$folder" || { echo "::error::Missing $name.imageset"; exit 1; }
            python3 - "$folder" <<'PY'
          import json, sys
          from pathlib import Path
          folder = Path(sys.argv[1])
          manifest = folder / "Contents.json"
          data = json.loads(manifest.read_text())
          for image in data.get("images", []):
              filename = image.get("filename")
              if filename and not (folder / filename).is_file():
                  raise SystemExit(f"Missing image: {folder / filename}")
          jpgs = list(folder.glob("*.jpg"))
          if len(jpgs) != 1:
              raise SystemExit(f"Expected one JPG in {folder}, found {len(jpgs)}")
          PY
            if [ -e "$destination/$name.imageset" ]; then
              echo "::error::Refusing to overwrite existing asset set: $name"
              exit 1
            fi
            cp -R "$folder" "$destination/$name.imageset"
          done

          rm "$archive"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$destination"
          git commit -m "Import six redesigned category image assets"
          git push origin HEAD:home/final-design-asset-pass
